# Publicerar mappen ovning/ som Övningsappen på GitHub Pages vid varje push till main.
name: Publicera Övningsappen
on:
  push:
    branches: [main]
    paths: ["ovning/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ovning
      - id: deployment
        uses: actions/deploy-pages@v4
