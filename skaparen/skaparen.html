<title>Studiehjälpen Skaparen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: en kolumn med ett steg i taget och stora knappar, så att vem som helst hittar rätt. */
  :root {
    --bg: #f3f6fb;
    --yta: #ffffff;
    --text: #1d2433;
    --dämpad: #5b6478;
    --kant: #d5dcea;
    --accent: #2f6fe4;
    --accent-text: #ffffff;
    --accent-ljus: #e6eefc;
    --varning: #b8620b;
    --varning-bg: #fff3e2;
    --fel: #c0392b;
    --ok: #1f8a4c;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141823; --yta: #1d2230; --text: #e7ebf3; --dämpad: #a1aac0; --kant: #343b4f;
      --accent: #6d9cff; --accent-text: #0d1220; --accent-ljus: #22304d; --varning: #f0a54a; --varning-bg: #3a2b17;
      --fel: #ff7a6b; --ok: #5fd08f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141823; --yta: #1d2230; --text: #e7ebf3; --dämpad: #a1aac0; --kant: #343b4f;
    --accent: #6d9cff; --accent-text: #0d1220; --accent-ljus: #22304d; --varning: #f0a54a; --varning-bg: #3a2b17;
    --fel: #ff7a6b; --ok: #5fd08f; color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--text); font: 17px/1.5 var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 48px;
  }
  main { max-width: 600px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 1.6rem; margin: 0; text-wrap: balance; line-height: 1.2; }
  h2 { font-size: 1.15rem; margin: 0; }
  p { margin: 0; }
  .liten { font-size: 0.9rem; color: var(--dämpad); }
  .kort { background: var(--yta); border: 1px solid var(--kant); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .stapel { display: grid; gap: 10px; }
  .rad { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mellan { justify-content: space-between; }
  label { display: grid; gap: 4px; font-weight: 600; }
  label.kryss { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  label.kryss input { width: 22px; height: 22px; }
  input[type="text"], input[type="number"], select, textarea {
    font: inherit; padding: 12px; border: 1px solid var(--kant); border-radius: 10px;
    background: var(--bg); color: var(--text); width: 100%; box-sizing: border-box;
  }
  textarea { min-height: 120px; resize: vertical; }
  button, .knapp {
    font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--kant);
    background: var(--yta); color: var(--text); cursor: pointer; text-align: left; min-height: 48px;
  }
  button.primär, .knapp.primär { background: var(--accent); color: var(--accent-text); border-color: var(--accent); text-align: center; }
  button.stor, .knapp.stor { min-height: 60px; font-size: 1.15rem; }
  button.länk { background: none; border: none; color: var(--accent); padding: 6px 0; min-height: 0; justify-self: start; }
  button.farlig { color: var(--fel); border-color: var(--fel); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .knapp:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .val { display: grid; gap: 4px; width: 100%; padding: 16px; }
  .val strong { font-size: 1.15rem; }
  .val[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-ljus); outline: 2px solid var(--accent); }
  .person { display: flex; align-items: center; gap: 14px; width: 100%; }
  .person .emoji { font-size: 2rem; }
  .flikar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .flikar button { text-align: center; }
  .flikar button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .stegrad { font-size: 0.9rem; color: var(--dämpad); font-weight: 600; }
  .knapp input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .knapp { position: relative; display: block; text-align: center; }
  .bilder { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  .bild { position: relative; aspect-ratio: 3 / 4; border: 1px solid var(--kant); border-radius: 10px; overflow: hidden; background: var(--bg); display: grid; place-items: center; font-size: 0.8rem; text-align: center; padding: 4px; }
  .bild img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .bild button { position: absolute; top: 4px; right: 4px; min-height: 0; width: 30px; height: 30px; padding: 0; border-radius: 999px; text-align: center; }
  .steg { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .steg li { display: flex; gap: 10px; align-items: center; }
  .steg li.klar { color: var(--ok); }
  .steg li.väntar { color: var(--dämpad); }
  .status { padding: 12px; border-radius: 10px; background: var(--bg); }
  .status.fel { color: var(--fel); }
  .tabell { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--kant); vertical-align: top; }
  tr.osäker td { background: var(--varning-bg); }
  .kod { font-family: var(--mono); font-size: 0.75rem; word-break: break-all; max-height: 96px; overflow: auto; padding: 8px; background: var(--bg); border-radius: 8px; }
  .fråga { border-top: 1px solid var(--kant); padding-top: 8px; display: grid; gap: 2px; }
  .fråga.osäker { background: var(--varning-bg); }
  .läxa { display: grid; gap: 2px; width: 100%; }
  .läxa[aria-expanded="true"] { border-color: var(--accent); }
  .detalj { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--kant); border-radius: 12px; background: var(--bg); }
  .instruktion { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
  .emojival { display: flex; flex-wrap: wrap; gap: 6px; }
  .emojival button { font-size: 1.6rem; min-width: 52px; text-align: center; padding: 4px; }
  .emojival button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-ljus); }
  details summary { cursor: pointer; font-weight: 600; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <div id="vy" style="display:grid;gap:16px"></div>
  <details class="liten">
    <summary>Teknisk information</summary>
    <p id="diag" style="margin-top:8px">Kontrollerar…</p>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
const MAX_SIDOR = 10;
const MAX_SIDOR_TOTALT = 30;
const SPRÅK = { en: "engelska", es: "spanska" };
const TYPER = {
  glosor: { ikon: "📘", namn: "Glosor", beskrivning: "En ordlista att lära sig, till exempel hund – dog." },
  grammatik: { ikon: "✏️", namn: "Grammatik", beskrivning: "Övningar i engelska eller spanska: pronomen, verb, meningar …" },
  fakta: { ikon: "🌍", namn: "Faktatext", beskrivning: "En text att lära sig fakta ur: SO, NO, historia …" },
};
const $ = (id) => document.getElementById(id);

let sample = null;
let bildgräns = null;   // limits().images, eller null om bilder inte går
let samling = null;     // db-samlingen med sparade läxor (och personerna), eller null
let personer = [];      // barnen (och kanske vuxna) som läxor görs åt
let pågående = null;    // AbortController för det som Claude jobbar med
let ny = null;          // den läxa som håller på att skapas

function h(tagg, attr = {}, ...barn) {
  const el = document.createElement(tagg);
  for (const [k, v] of Object.entries(attr)) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const b of barn.flat()) if (b !== null && b !== undefined && b !== false) el.append(b);
  return el;
}
function visa(...delar) { visasNu = "annat"; $("vy").replaceChildren(...delar.filter((d) => d != null && d !== false)); window.scrollTo(0, 0); }

// ---------- Personer ----------
const ålderFör = (p) => (p?.födelseår ? new Date().getFullYear() - p.födelseår : 12);
const språkFör = (kod, namn) => ({ kod, namn: SPRÅK[kod] ?? namn ?? kod });
const personNamn = (id) => personer.find((p) => p.id === id);
const läxorFör = (p) => senasteLäxor.filter((l) => (p ? l.för === p.id : !personNamn(l.för)));
async function sparaPersoner() {
  try { localStorage.setItem("skaparen.personer", JSON.stringify(personer)); } catch {}
  if (samling) { try { await samling.doc("_personer").set({ personer }); } catch {} }
}

function vyPerson(p = null) {
  const EMOJI = ["🦊", "🐼", "🐯", "🐸", "🦉", "🐙", "🦄", "🐶", "🐱", "🐧", "🦁", "🙂"];
  let emoji = p?.emoji ?? EMOJI[0];
  const år = new Date().getFullYear();
  const namn = h("input", { type: "text", id: "p-namn", value: p?.namn ?? "", autocomplete: "off" });
  const född = h("select", { id: "p-född" }, h("option", { value: "" }, "Vuxen"),
    ...Array.from({ length: 16 }, (_, i) => år - 5 - i).map((y) => h("option", { value: y }, `${y} (${år - y} år)`)));
  född.value = p ? (p.födelseår ?? "") : år - 10;
  const val = h("div", { class: "emojival" }, ...EMOJI.map((e) => h("button", { "aria-pressed": String(e === emoji), "aria-label": e,
    onclick: (ev) => { emoji = e; val.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === ev.currentTarget))); } }, e)));
  const fel = h("p", { class: "status fel", hidden: true });
  visa(
    h("button", { class: "länk", onclick: () => (p ? vyPersonHem(p) : vyStart()) }, "← Tillbaka"),
    h("h1", {}, p ? `Ändra ${p.namn}` : "Lägg till en person"),
    h("div", { class: "kort" },
      h("label", { for: "p-namn" }, "Namn", namn),
      h("div", { class: "stapel" }, h("strong", {}, "Figur"), val),
      h("label", { for: "p-född" }, "Födelseår", född),
      h("p", { class: "liten" }, "Åldern gör att frågorna och glosorna blir lagom svåra.")),
    fel,
    h("button", { class: "primär stor", onclick: async () => {
      if (!namn.value.trim()) { fel.hidden = false; fel.textContent = "Skriv ett namn."; return; }
      const post = { ...(p ?? {}), id: p?.id ?? Math.random().toString(36).slice(2, 8), namn: namn.value.trim(), emoji,
        födelseår: född.value ? Number(född.value) : null };
      personer = p ? personer.map((x) => (x.id === p.id ? post : x)) : [...personer, post];
      await sparaPersoner();
      vyPersonHem(post);
    } }, "Spara"),
    p ? h("button", { class: "farlig", onclick: async () => { personer = personer.filter((x) => x.id !== p.id); await sparaPersoner(); vyStart(); } }, `Ta bort ${p.namn} ur listan`) : null,
  );
}

// ---------- Start: välj person ----------
let aktuell = null; // personen vars sida visas (null = startsidan)
function vyStart() {
  aktuell = null;
  const utanPerson = läxorFör(null);
  visa(
    h("h1", {}, "Skaparen"),
    h("p", {}, "Vem gäller det?"),
    personer.length
      ? h("div", { class: "stapel" }, ...personer.map((p) => h("button", { class: "person", onclick: () => vyPersonHem(p) },
          h("span", { class: "emoji" }, p.emoji),
          h("span", { class: "stapel", style: "gap:0" }, h("strong", {}, p.namn),
            h("span", { class: "liten" }, [p.födelseår ? `${ålderFör(p)} år` : "", `${läxorFör(p).length} ${läxorFör(p).length === 1 ? "läxa" : "läxor"}`].filter(Boolean).join(" · "))))))
      : h("p", { class: "kort" }, "Börja med att lägga till barnen. Det behövs bara en gång."),
    h("button", { class: personer.length ? "" : "primär stor", onclick: () => vyPerson() }, "➕ Lägg till en person"),
    utanPerson.length ? h("button", { onclick: () => vyLäxor(null) }, `📄 Äldre läxor utan person (${utanPerson.length})`) : null,
  );
  visasNu = "start";
}

// ---------- Personens sida ----------
function vyPersonHem(p) {
  aktuell = p;
  const antal = läxorFör(p).length;
  visa(
    h("button", { class: "länk", onclick: vyStart }, "← Byt person"),
    h("div", { class: "rad mellan" },
      h("h1", {}, `${p.emoji} ${p.namn}`),
      h("button", { "aria-label": `Ändra ${p.namn}`, onclick: () => vyPerson(p) }, "✏️ Ändra")),
    p.födelseår ? h("p", { class: "liten" }, `${ålderFör(p)} år`) : null,
    h("button", { class: "val", onclick: () => { ny = { person: p, filer: [], samFiler: [], klistrad: "", upptäckare: true, källa: "foto", antal: 15 }; vyTyp(); } },
      h("strong", {}, "✨ Ny läxa"), h("span", { class: "liten" }, "Fota eller välj fil, eller låt Claude hitta på glosor.")),
    h("button", { class: "val", onclick: () => vyLäxor(p) },
      h("strong", {}, `📚 Läxor (${antal})`), h("span", { class: "liten" }, antal ? "Skicka igen, lägg till sidor eller gör fler frågor." : "Här hamnar allt du skapar.")),
  );
  visasNu = "person";
}
function börjaOm() { aktuell ? vyPersonHem(aktuell) : vyStart(); }

// ---------- Steg 1: Vad ----------
function vyTyp() {
  visa(
    h("button", { class: "länk", onclick: () => vyPersonHem(ny.person) }, "← Tillbaka"),
    h("p", { class: "stegrad" }, `Steg 1 av 2 · ${ny.person.emoji} ${ny.person.namn}`),
    h("h1", {}, "Vad är det för läxa?"),
    ...Object.entries(TYPER).map(([typ, t]) => h("button", { class: "val", onclick: () => { ny.typ = typ; vyMaterial(); } },
      h("strong", {}, `${t.ikon} ${t.namn}`), h("span", { class: "liten" }, t.beskrivning))),
  );
}

// ---------- Steg 3: Material ----------
function filKnapp(text, klass, välj) {
  const input = h("input", { type: "file", multiple: true, accept: "image/*,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    onchange: () => { välj([...input.files]); input.value = ""; } });
  return h("label", { class: `knapp ${klass}` }, text, input);
}
function filRutor(lista, ändrat) {
  return h("div", { class: "bilder" }, ...lista.map((f, i) => h("div", { class: "bild" },
    f.type.startsWith("image/") ? h("img", { src: URL.createObjectURL(f), alt: `Sida ${i + 1}` }) : h("span", {}, `📄 ${f.name}`),
    h("button", { "aria-label": "Ta bort", onclick: () => { lista.splice(i, 1); ändrat(); } }, "✕"))));
}

// Språket väljs per läxa (samma barn kan läsa flera språk). Senast valda språk för barnet är förvalt.
function språkVäljare() {
  ny.språk ??= språkFör(ny.person.senasteSpråk ?? "en", ny.person.senasteSpråkNamn);
  const val = h("select", { id: "m-språk" }, h("option", { value: "en" }, "Engelska"), h("option", { value: "es" }, "Spanska"), h("option", { value: "annat" }, "Annat språk…"));
  val.value = SPRÅK[ny.språk.kod] ? ny.språk.kod : "annat";
  const annat = h("input", { type: "text", id: "m-annat", value: SPRÅK[ny.språk.kod] ? "" : ny.språk.namn, placeholder: "t.ex. tyska" });
  const annatRad = h("label", { for: "m-annat", hidden: val.value !== "annat" }, "Vilket språk?", annat);
  const uppdatera = () => {
    annatRad.hidden = val.value !== "annat";
    ny.språk = val.value === "annat" ? { kod: annat.value.trim().toLowerCase() || "annat", namn: annat.value.trim() || "det andra språket" } : språkFör(val.value);
  };
  val.addEventListener("change", uppdatera);
  annat.addEventListener("input", uppdatera);
  return h("div", { class: "stapel" }, h("label", { for: "m-språk" }, "Språk", val), annatRad);
}

function vyMaterial() {
  const t = TYPER[ny.typ];
  const hittaPå = ny.typ === "glosor" && ny.källa === "claude";
  const klistra = h("textarea", { id: "m-klistra", placeholder: ny.typ === "glosor" ? "hund – dog\nkatt – cat" : "Klistra in texten här" }, ny.klistrad);
  klistra.addEventListener("input", () => { ny.klistrad = klistra.value; });
  const önskemål = h("textarea", { id: "m-önskemål", rows: 3, placeholder: "t.ex. djur på bondgården, enkla verb, saker i köket" }, ny.önskemål ?? "");
  önskemål.addEventListener("input", () => { ny.önskemål = önskemål.value; });
  const antal = h("select", { id: "m-antal", onchange: (e) => { ny.antal = Number(e.target.value); } },
    ...[10, 15, 20, 30].map((n) => h("option", { value: n }, `${n} glosor`)));
  antal.value = ny.antal;
  const fel = h("p", { class: "status fel", hidden: true });
  const rita = () => vyMaterial();
  const väljKälla = (källa) => { ny.källa = källa; rita(); };
  visa(
    h("button", { class: "länk", onclick: vyTyp }, "← Tillbaka"),
    h("p", { class: "stegrad" }, `Steg 2 av 2 · ${ny.person.emoji} ${ny.person.namn} · ${t.ikon} ${t.namn}`),
    h("h1", {}, hittaPå ? "Låt Claude hitta på glosor" : "Lägg till läxan"),
    ny.typ !== "fakta" ? h("div", { class: "kort" }, språkVäljare()) : null,
    ny.typ === "glosor" ? h("div", { class: "flikar" },
      h("button", { "aria-selected": String(!hittaPå), onclick: () => väljKälla("foto") }, "📷 Från läxan"),
      h("button", { "aria-selected": String(hittaPå), onclick: () => väljKälla("claude") }, "✨ Claude hittar på")) : null,
    hittaPå ? h("div", { class: "kort" },
      h("label", { for: "m-önskemål" }, "Vad ska glosorna handla om?", önskemål),
      h("label", { for: "m-antal" }, "Hur många?", antal),
      h("p", { class: "liten" }, `Claude gör glosor som passar ${ny.person.namn}${ny.person.födelseår ? `, ${ålderFör(ny.person)} år` : ""}.`)) : null,
    hittaPå ? null : h("div", { class: "kort" },
      ny.typ !== "glosor" ? h("strong", {}, "📖 Läxans sidor") : null,
      filKnapp(ny.filer.length ? "➕ Lägg till fler" : "📷 Fota eller välj fil", ny.filer.length ? "" : "primär stor",
        (f) => { ny.filer.push(...f); rita(); }),
      ny.filer.length ? filRutor(ny.filer, rita) : h("p", { class: "liten" }, `Ta en bild per sida eller välj bilder, PDF eller Word. Högst ${MAX_SIDOR} sidor.${ny.typ !== "glosor" ? " Har ni bara lärarens sammanfattning går det bra att hoppa över det här." : ""}`),
      h("details", { open: ny.klistrad ? true : null }, h("summary", {}, "Har du texten i stället? Klistra in den"), h("div", { style: "margin-top:8px" }, klistra))),
    ny.typ !== "glosor" ? h("div", { class: "kort" },
      h("strong", {}, "📝 Lärarens sammanfattning"),
      h("p", { class: "liten" }, "Har barnet fått en sammanfattning inför provet? Lägg till den så blir frågorna om den provfrågor. Kommer den senare kan du lägga till den under 📚 Mina läxor."),
      filKnapp(ny.samFiler.length ? "➕ Lägg till fler" : "📷 Fota eller välj fil", "", (f) => { ny.samFiler.push(...f); rita(); }),
      ny.samFiler.length ? filRutor(ny.samFiler, rita) : null) : null,
    ny.typ === "fakta" ? h("div", { class: "kort" },
      h("label", { class: "kryss" }, h("input", { type: "checkbox", checked: ny.upptäckare ? true : null, onchange: (e) => { ny.upptäckare = e.target.checked; } }),
        "🌟 Ta med extra kunskap utöver texten (Upptäckare)")) : null,
    fel,
    h("button", { class: "primär stor", onclick: () => {
      if (hittaPå && !(ny.önskemål ?? "").trim()) { fel.hidden = false; fel.textContent = "Skriv vad glosorna ska handla om."; return; }
      if (!hittaPå && !ny.filer.length && !ny.klistrad.trim() && !ny.samFiler.length) { fel.hidden = false; fel.textContent = "Lägg till läxans sidor, lärarens sammanfattning eller klistra in text först."; return; }
      if (ny.språk?.kod === "annat") { fel.hidden = false; fel.textContent = "Skriv vilket språk det är."; return; }
      skapa();
    } }, hittaPå ? "✨ Hitta på glosor" : "✨ Skapa läxan"),
  );
}

// ---------- Arbete och förlopp ----------
let stegLista = [];
function visaArbete(steg, aktivt, detalj = "") {
  stegLista = steg;
  visa(
    h("h1", {}, "Claude arbetar…"),
    h("div", { class: "kort" },
      h("ol", { class: "steg" }, ...steg.map((s, i) => h("li", { class: i < aktivt ? "klar" : i > aktivt ? "väntar" : "" },
        h("span", {}, i < aktivt ? "✅" : i === aktivt ? "⏳" : "⚪"), h("span", {}, s)))),
      detalj ? h("p", { class: "liten" }, detalj) : null),
    h("p", { class: "liten" }, "Det tar oftast 1–2 minuter. Låt sidan vara öppen."),
    h("button", { onclick: () => pågående?.abort() }, "Avbryt"),
  );
}
const stegStatus = (aktivt) => (detalj) => visaArbete(stegLista, aktivt, detalj);

// ---------- Filer till bilder och text ----------
const BILDTYPER = ["image/jpeg", "image/png", "image/webp", "image/gif"];

async function tillJpeg(källa) {
  // källa: Blob eller canvas. Skalar ned till max 2000 px på längsta sidan.
  let bild = källa;
  if (källa instanceof Blob) bild = await createImageBitmap(källa);
  const skala = Math.min(1, 2000 / Math.max(bild.width, bild.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bild.width * skala);
  c.height = Math.round(bild.height * skala);
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  return await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
}

async function pdfTillBilder(fil, plats) {
  const data = new Uint8Array(await fil.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const bilder = [];
  const antal = Math.min(pdf.numPages, plats);
  for (let i = 1; i <= antal; i++) {
    const sida = await pdf.getPage(i);
    const vy = sida.getViewport({ scale: 1 });
    const vy2 = sida.getViewport({ scale: 1600 / Math.max(vy.width, vy.height) });
    const c = document.createElement("canvas");
    c.width = Math.round(vy2.width); c.height = Math.round(vy2.height);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await sida.render({ canvasContext: ctx, viewport: vy2 }).promise;
    bilder.push(await tillJpeg(c));
  }
  return { bilder, hoppadeÖver: pdf.numPages - antal };
}

// Läser filer till bilder (foton, PDF-sidor) och text (Word). maxSidor gäller bilderna.
async function samlaIn(filer, klistrad = "", maxSidor = MAX_SIDOR) {
  const bilder = [];
  const texter = [];
  const varningar = [];
  for (const f of filer) {
    const namn = f.name.toLowerCase();
    if (f.type === "application/pdf" || namn.endsWith(".pdf")) {
      if (!bildgräns) throw new Error("Den här vyn kan inte skicka bilder till Claude, så PDF går inte här.");
      const { bilder: b, hoppadeÖver } = await pdfTillBilder(f, maxSidor - bilder.length);
      bilder.push(...b);
      if (hoppadeÖver > 0) varningar.push(`${f.name}: ${hoppadeÖver} sidor togs inte med (max ${maxSidor}).`);
    } else if (namn.endsWith(".docx")) {
      const { value } = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
      texter.push(value.trim());
    } else if (f.type.startsWith("image/") || /\.(heic|heif|jpe?g|png|webp|gif)$/.test(namn)) {
      if (!bildgräns) throw new Error("Den här vyn kan inte skicka bilder till Claude.");
      if (bilder.length >= maxSidor) { varningar.push(`${f.name} togs inte med (max ${maxSidor} sidor).`); continue; }
      bilder.push(BILDTYPER.includes(f.type) && f.size < 4e6 ? f : await tillJpeg(f));
    } else {
      varningar.push(`${f.name}: filtypen stöds inte.`);
    }
  }
  if (klistrad.trim()) texter.push(klistrad.trim());
  return { bilder, text: texter.join("\n\n").slice(0, 60000), varningar };
}

// Delar upp en avskrift i stycken. Korta rader utan punkt blir rubrik till nästa stycke.
function delaIStycken(rå) {
  const delar = rå.replace(/\r/g, "").split(/\n\s*\n/)
    .map((s) => s.replace(/\[Sida \d+\]/gi, "").trim()).filter(Boolean);
  const stycken = [];
  let rubrik = "";
  for (const del of delar) {
    if (del.length < 70 && !/[.!?:”"]$/.test(del) && !del.startsWith("[")) { rubrik = rubrik ? `${rubrik} – ${del}` : del; continue; }
    // Väldigt långa stycken delas vid en mening, så att uppläsningen blir lagom lång.
    let rest = del.replace(/\s*\n\s*/g, " ");
    while (rest.length > 900) {
      const snitt = rest.lastIndexOf(". ", 700);
      if (snitt < 200) break;
      stycken.push({ id: `s${stycken.length + 1}`, ...(rubrik && { rubrik }), text: rest.slice(0, snitt + 1) });
      rubrik = ""; rest = rest.slice(snitt + 2);
    }
    stycken.push({ id: `s${stycken.length + 1}`, ...(rubrik && { rubrik }), text: rest });
    rubrik = "";
  }
  if (rubrik) stycken.push({ id: `s${stycken.length + 1}`, text: rubrik });
  return stycken;
}

async function skrivAv(bilder, visaStatus) {
  const perGång = bildgräns?.maxCount ?? 1;
  const avskrifter = [];
  for (let i = 0; i < bilder.length; i += perGång) {
    const grupp = bilder.slice(i, i + perGång);
    visaStatus(`Sidorna ${i + 1}–${i + grupp.length} av ${bilder.length}`);
    const { text } = await sample(avskriftInstruktion(i + 1, i + grupp.length, bilder.length), { images: grupp, signal: pågående.signal, modelTier: "default" });
    avskrifter.push(text);
  }
  return avskrifter.join("\n\n");
}

// Skriver av bilderna och delar upp allt i stycken. prefix: "s" för boken, "t" för lärarens sammanfattning.
async function läsInText(filer, klistrad, maxSidor, prefix, startNr, visaStatus) {
  const { bilder, text, varningar } = await samlaIn(filer, klistrad, maxSidor);
  if (!bilder.length && !text) return { stycken: [], sidor: 0, varningar };
  const avskrift = [bilder.length ? await skrivAv(bilder, visaStatus) : "", text].filter(Boolean).join("\n\n");
  const stycken = delaIStycken(avskrift).map((s, i) => ({ ...s, id: `${prefix}${startNr + i + 1}` }));
  return { stycken, sidor: bilder.length, varningar };
}

// ---------- Instruktioner till Claude ----------
const OSÄKER_REGEL = `- "osaker": sätt true ENDAST om du inte kunde läsa just den delen säkert, till exempel för att den var suddig, avklippt, överstruken eller skriven med svårläst handstil. Om texten gick att läsa tydligt ska det vara false, även om ordet är ovanligt eller svårt. Normalt ska nästan alla vara false.`;

// Claude får föreslå en annan typ, men användaren bestämmer (tvinga = användaren har sagt nej till förslaget).
function typKoll(typ, tvinga) {
  if (tvinga) return `Användaren har själv valt att göra ${TYPER[typ].namn.toLowerCase()} av det här materialet. Gör det bästa möjliga av det, även om materialet inte är en typisk ${TYPER[typ].namn.toLowerCase()}-läxa.`;
  const andra = Object.entries(TYPER).filter(([k]) => k !== typ).map(([k, t]) => `"${k}" (${t.beskrivning})`).join(" eller ");
  return `Användaren har valt typen "${TYPER[typ].namn}" (${TYPER[typ].beskrivning}). Om materialet TYDLIGT passar bättre som ${andra}, svara i stället ENDAST med JSON: {"forslag": "glosor" | "grammatik" | "fakta", "varfor": "kort förklaring på svenska, max 20 ord"}. Annars gör som nedan.`;
}

function avskriftInstruktion(från, till, totalt) {
  return `Bilderna är sidorna ${från}–${till} av ${totalt} ur ett skolmaterial. Skriv av all text ordagrant, i läsordning.
- Skriv "[Sida N]" på en egen rad före varje sida.
- Rubriker på en egen rad. En tom rad mellan varje stycke.
- Beskriv bilder, kartor och diagram kort på en egen rad inom hakparentes, till exempel [Bild: karta över Norden med vikingarnas resvägar].
- Skriv [oläsligt] där du inte kan läsa texten säkert.
Svara bara med avskriften.`;
}

function glosInstruktion(språk, ålder, harBilder, text, tvinga) {
  return `Du hjälper ett barn i Sverige (${ålder} år) att plugga glosor mellan svenska och ${språk.namn}.
${harBilder ? "Bilderna är foton eller sidor ur läxan." : ""}
${text ? "Text från materialet:\n<<<\n" + text + "\n>>>" : ""}

${typKoll("glosor", tvinga)}

Hitta ordparen (glosorna) mellan svenska och ${språk.namn}. Regler:
- ${tvinga ? "Är materialet ingen ordlista: välj de 15–30 viktigaste orden och uttrycken i materialet." : "Ta bara med ordpar som faktiskt finns i materialet. Hitta inte på egna."}
- Svenska skrivs utan artikel (hund, inte en hund).
- Engelska substantiv skrivs utan artikel (dog).
- Spanska substantiv skrivs ALLTID med bestämd artikel så att genus syns (el perro, la casa, los zapatos). Lägg till artikeln om materialet saknar den.
- För andra språk: följ hur ord brukar läras in i skolan.
- Ett rätt svar per glosa. Om materialet anger flera betydelser, välj den första.
${OSÄKER_REGEL}
- Ge materialet en kort titel på svenska, till exempel "Spanska kapitel 3" eller "Engelska djur".

Svara ENDAST med JSON i exakt den här formen:
{"titel": "Engelska djur", "glosor": [{"sv": "hund", "ut": "dog", "osaker": false}]}`;
}

function hittaPåGlosorInstruktion(språk, ålder, önskemål, antal, befintliga = []) {
  return `Du hjälper ett barn i Sverige (${ålder} år) att plugga glosor mellan svenska och ${språk.namn}.
En förälder vill att du hittar på glosor. Förälderns önskemål:
<<<
${önskemål}
>>>
${befintliga.length ? `\nBarnet har redan de här glosorna. Ta INTE med dem igen:\n${befintliga.map((g) => `- ${g.sv} – ${g.ut}`).join("\n")}\n` : ""}
Gör exakt ${antal} ${befintliga.length ? "NYA " : ""}glosor som passar önskemålet och barnets ålder. Regler:
- Vanliga, användbara ord som barn i ${ålder}-årsåldern lär sig i skolan. Inga ovanliga eller vuxna ord.
- Svenska skrivs utan artikel (hund, inte en hund).
- Engelska substantiv skrivs utan artikel (dog).
- Spanska substantiv skrivs ALLTID med bestämd artikel så att genus syns (el perro, la casa).
- Ett rätt svar per glosa, och ingen glosa två gånger.
- Ge glosorna en kort titel på svenska, till exempel "Engelska: djur på bondgården".

Svara ENDAST med JSON i exakt den här formen:
{"titel": "...", "glosor": [{"sv": "hund", "ut": "dog", "osaker": false}]}`;
}

const numreradText = (stycken) => stycken.map((s) => `[${s.id}]${s.rubrik ? " " + s.rubrik + ":" : ""} ${s.text}`).join("\n\n");
// Hela läxan som text till Claude: lärarens sammanfattning (om den finns) först, sedan boken.
function läxText(bok, sam) {
  if (!sam?.length) return numreradText(bok);
  const delar = [`LÄRARENS SAMMANFATTNING (det läraren säger är viktigast inför provet):\n${numreradText(sam)}`];
  if (bok?.length) delar.push(`BOKEN:\n${numreradText(bok)}`);
  return delar.join("\n\n");
}
// Utan boksidor handlar allt om lärarens sammanfattning, och då är alla frågor provfrågor.
const fördelning = (antal, harSam, harBok = true) => harSam && !harBok ? `alla med "prov": true` : harSam
  ? `ungefär ${Math.round((antal * 2) / 3)} med "prov": true om det som står i lärarens sammanfattning, och resten med "prov": false om sådant i boken som INTE står i sammanfattningen`
  : `alla med "prov": false`;

// Faktatexter får frågor, grammatik får övningar. Båda blir flervalsfrågor i appen.
function frågeRegler(typ, ålder, språk) {
  if (typ === "grammatik") return `Övningarna ska träna SAMMA grammatik som läxan, i samma stil och på samma nivå. Välj själv de övningstyper som passar läxan, till exempel: fyll i luckan, välj rätt form, välj rätt pronomen, välj den korrekta meningen eller översätt en svensk mening.
- "uppgift": kort instruktion på svenska, till exempel "Välj rätt pronomen".
- "mening": meningen på ${språk.namn} med ___ där luckan är. Vid översättning: den svenska meningen, och då är "oversatt": true. Tom sträng om uppgiften inte har någon mening.
- "ratt": rätt svar. "fel": 3–5 felaktiga men rimliga svar, gärna typiska misstag.
- "forklaring": varför rätt svar är rätt, på svenska, max 20 ord.
- "niva": 1 lätt, 2 svårare.
- "prov": true om övningen tränar något som står i lärarens sammanfattning, annars false.
- "stycke": id för stycket i läxan som övningen bygger på, till exempel "s3".
${OSÄKER_REGEL}
- Ord och meningar ska passa ${ålder} år.`;
  return `- Alla frågor ska kunna besvaras med texten. Hitta inte på fakta.
- Blanda typerna "flerval" (cirka tre av fyra) och "santfalskt" (cirka en av fyra).
  - flerval: "fraga", "ratt" (rätt svar), "fel" (exakt 5 felaktiga men rimliga svar, ungefär lika långa som rätt svar).
  - santfalskt: "pastaende" och "sant" (true/false).
- "niva": 1 för minnesfrågor (vem, vad, när), 2 för förståelsefrågor (varför, vad hände sedan). Ungefär två av tre ska vara nivå 1.
- "stycke": id för stycket svaret finns i, till exempel "s3" eller "t2".
- "kalla": den mening ur stycket (max 30 ord) som svaret bygger på, ordagrant.
- "prov": true om frågan handlar om något som står i lärarens sammanfattning, annars false.
${OSÄKER_REGEL}
- Enkelt språk för ${ålder} år. Sprid frågorna över hela texten.`;
}
const frågeForm = (typ) => typ === "grammatik"
  ? `{"uppgift": "Välj rätt pronomen", "mening": "___ is my brother.", "oversatt": false, "ratt": "He", "fel": ["Him", "His", "She"], "forklaring": "...", "niva": 1, "stycke": "s1", "prov": false, "osaker": false}`
  : `{"typ": "flerval", "fraga": "...", "ratt": "...", "fel": ["...","...","...","...","..."], "niva": 1, "stycke": "s1", "kalla": "...", "prov": false, "osaker": false}, {"typ": "santfalskt", "pastaende": "...", "sant": true, "niva": 1, "stycke": "s2", "kalla": "...", "prov": false, "osaker": false}`;
const vad = (typ) => (typ === "grammatik" ? "övningar" : "frågor");

function huvudInstruktion(typ, ålder, språk, bok, sam, tvinga) {
  const grammatik = typ === "grammatik";
  return `Du hjälper ett barn i Sverige (${ålder} år) att plugga ${grammatik ? `${språk.namn} grammatik` : "inför ett prov"}. Här är läxan, uppdelad i numrerade stycken:
<<<
${läxText(bok, sam)}
>>>

${typKoll(typ, tvinga)}

Gör ett studiepaket:
- "titel": kort titel på svenska, till exempel ${grammatik ? `"Engelska: pronomen"` : `"Vikingatiden"`}.
${grammatik
    ? `- "regler": 2–6 korta regler på svenska som förklarar grammatiken i läxan: "rubrik" och "text" (max 40 ord, med exempel på ${språk.namn}).`
    : `- "sammanfattning": högst 120 ord, enkelt språk.\n- "begrepp": 5–15 viktiga ord ur texten med en kort förklaring (max 12 ord).`}
- "fragor": exakt 30 ${vad(typ)}, ${fördelning(30, sam?.length, bok?.length)}.
${frågeRegler(typ, ålder, språk)}

Svara ENDAST med JSON i exakt den här formen:
{"titel": "...", ${grammatik ? `"regler": [{"rubrik": "...", "text": "..."}]` : `"sammanfattning": "...", "begrepp": [{"ord": "...", "forklaring": "..."}]`},
 "fragor": [${frågeForm(typ)}]}`;
}

function flerInstruktion(m, befintliga) {
  return `Du hjälper ett barn i Sverige (${m.ålder || 12} år) att plugga. Här är läxan, uppdelad i numrerade stycken:
<<<
${läxText(m.text, m.provtext)}
>>>

Barnet har redan de här ${vad(m.typ)}:
${befintliga.map((f) => "- " + f).join("\n")}

Gör exakt 15 NYA ${vad(m.typ)}, ${fördelning(15, m.provtext?.length, m.text?.length)}. De får inte vara samma som de ovan. ${m.typ === "grammatik" ? "Variera meningarna och orden." : "Leta efter detaljer och samband som inte har frågats om."}
${frågeRegler(m.typ, m.ålder || 12, m.språk)}

Svara ENDAST med JSON i exakt den här formen:

function nyaSidorInstruktion(m, nya, befintliga) {
  return `Du hjälper ett barn i Sverige (${m.ålder || 12} år) att plugga. Läxan har fått nya sidor.
${m.provtext?.length ? `Lärarens sammanfattning (det viktigaste inför provet):\n<<<\n${numreradText(m.provtext)}\n>>>\n` : ""}
De NYA styckena:
<<<
${numreradText(nya)}
>>>

Barnet har redan de här ${vad(m.typ)}:
${befintliga.map((f) => "- " + f).join("\n")}

Gör exakt 10 NYA ${vad(m.typ)} om de nya styckena. Sätt "prov": true på dem som handlar om något som också står i lärarens sammanfattning.

Svara ENDAST med JSON i exakt den här formen:

function provInstruktion(m, sam) {
  return `Du hjälper ett barn i Sverige (${m.ålder || 12} år) att plugga inför ett prov. Läraren har delat ut en sammanfattning av det som är viktigast.
LÄRARENS SAMMANFATTNING:

>>>
LÄXAN:
<<<
${numreradText(m.text)}
>>>

Barnet har redan de här ${vad(m.typ)} (id: text):
${m.fragor.filter((f) => !f.prov).map((f) => `- ${f.id}: ${[f.fraga || f.pastaende, f.mening].filter(Boolean).join(" ")}`).join("\n")}

1. "matchar": lista id för de befintliga ${vad(m.typ)} ovan som tränar något som står i lärarens sammanfattning.
2. "fragor": gör exakt 20 NYA ${vad(m.typ)} med "prov": true om innehållet i lärarens sammanfattning, så att allt viktigt i den täcks. Upprepa inte det som de i "matchar" redan tar upp. "stycke" kan vara ett t-id (sammanfattningen) eller ett s-id (läxan).
${frågeRegler(m.typ, m.ålder || 12, m.språk)}

Svara ENDAST med JSON i exakt den här formen:
{"matchar": ["f3", "f7"], "fragor": [${frågeForm(m.typ)}]}`;

function upptäckarInstruktion(ålder, text, antal, redanKända) {
  return `Du hjälper ett barn i Sverige (${ålder} år) som redan kan sin läxa att lära sig lite MER än det som står i texten.
Här är läxtexten:
<<<
${text}
>>>
${redanKända.length ? "\nBarnet har redan fått de här faktarutorna, upprepa dem inte:\n" + redanKända.map((f) => "- " + f).join("\n") + "\n" : ""}
Gör ${antal} korta faktarutor med intressant kunskap som INTE står i texten men som hör ihop med textens ämnen, och en fråga om varje faktaruta.
Regler:
- Bara väletablerad kunskap som står i vanliga uppslagsverk. Inget som forskare är oense om, inga osäkra siffror eller årtal.
- Inget som motsäger läxtexten.
- Passande för ${ålder} år: spännande men inte otäckt.
- "vistedu": börja med "Visste du att", max 35 ord, enkelt språk.
- Varje fråga ska gå att besvara med sin faktaruta. "fakta" anger vilken faktaruta (index från 0).
- Frågorna är "flerval" med "fraga", "ratt" och "fel" (exakt 5 felaktiga men rimliga svar), eller "santfalskt" med "pastaende" och "sant".

Svara ENDAST med JSON i exakt den här formen:
{"vistedu": ["Visste du att ...?"], "fragor": [{"typ": "flerval", "fraga": "...", "ratt": "...", "fel": ["...","...","...","...","..."], "fakta": 0}]}`;
}

// ---------- Kontroll av svaren ----------
const str = (x) => (typeof x === "string" ? x.trim() : "");

function städaGlosor(svar) {
  const glosor = (Array.isArray(svar?.glosor) ? svar.glosor : [])
    .map((g) => ({ sv: str(g.sv), ut: str(g.ut), osaker: g.osaker === true }))
    .filter((g) => g.sv && g.ut);
  if (!glosor.length) throw new Error("Claude hittade inga glosor i materialet.");
  return { titel: str(svar.titel), glosor };
}

function städaFrågor(lista, styckeIds) {
  return (Array.isArray(lista) ? lista : []).map((f) => {
    const bas = { niva: f.niva === 2 ? 2 : 1, kalla: str(f.kalla), osaker: f.osaker === true, ...(f.prov === true && { prov: true }),
      ...(styckeIds?.has(f.stycke) && { stycke: f.stycke }), ...(Number.isInteger(f.fakta) && { fakta: f.fakta }) };
    // Grammatikövning: uppgift + mening + förklaring.
    if (str(f.uppgift)) {
      const fel = (Array.isArray(f.fel) ? f.fel : []).map(str).filter((x) => x && x !== str(f.ratt));
      if (!str(f.ratt) || fel.length < 2) return null;
      const { kalla, ...utanKälla } = bas;
      return { typ: "flerval", fraga: str(f.uppgift), mening: str(f.mening), ...(f.oversatt === true && { oversatt: true }),
        ratt: str(f.ratt), fel: fel.slice(0, 5), forklaring: str(f.forklaring), ...utanKälla };
    }
    if (f.typ === "santfalskt" && str(f.pastaende) && typeof f.sant === "boolean")
      return { typ: "santfalskt", pastaende: str(f.pastaende), sant: f.sant, ...bas };
    const fel = (Array.isArray(f.fel) ? f.fel : []).map(str).filter((x) => x && x !== str(f.ratt));
    if (str(f.fraga) && str(f.ratt) && fel.length >= 2)
      return { typ: "flerval", fraga: str(f.fraga), ratt: str(f.ratt), fel: fel.slice(0, 5), ...bas };
    return null;
  }).filter(Boolean);
}

// Ger varje fråga ett id som fortsätter numreringen, så att barnets framsteg följer med vid uppdateringar.
function numrera(lista, prefix, befintliga) {
  let nr = Math.max(0, ...befintliga.map((x) => parseInt(String(x.id).slice(prefix.length), 10) || 0));
  return lista.map((x) => ({ id: `${prefix}${++nr}`, ...x }));
}

function städaUpptäckare(svar, befintlig = { fakta: [], fragor: [] }) {
  const nyaFakta = numrera((Array.isArray(svar?.vistedu) ? svar.vistedu : []).map(str).filter(Boolean).map((text) => ({ text })), "v", befintlig.fakta);
  const nyaFrågor = städaFrågor(svar?.fragor).filter((f) => nyaFakta[f.fakta])
    .map(({ fakta, stycke, kalla, osaker, prov, ...f }) => ({ ...f, fakta: nyaFakta[fakta].id }));
  return { fakta: [...befintlig.fakta, ...nyaFakta], fragor: [...befintlig.fragor, ...numrera(nyaFrågor, "u", befintlig.fragor)] };
}

// ---------- Skapa läxan ----------
// förberett: det som redan är avskrivet, så att inget behöver läsas om när typen byts efter Claudes förslag.
async function skapa(tvinga = false, förberett = null) {
  if (!sample) return vyFel("Claude är inte tillgängligt här. Öppna Skaparen på claude.ai.");
  const { typ, person, språk } = ny;
  const ålder = ålderFör(person);
  pågående = new AbortController();
  const start = performance.now();
  try {
    const bas = { v: 3, id: crypto.randomUUID().slice(0, 8), typ, skapad: new Date().toISOString().slice(0, 10), ålder, för: person.id };
    let m, varningar = [];
    // Kom ihåg språket till nästa gång för det här barnet.
    if (språk && typ !== "fakta" && person.senasteSpråk !== språk.kod) {
      person.senasteSpråk = språk.kod; person.senasteSpråkNamn = språk.namn;
      personer = personer.map((p) => (p.id === person.id ? person : p));
      sparaPersoner();
    }

    if (typ === "glosor" && ny.källa === "claude") {
      visaArbete(["Hittar på glosor", "Sparar"], 0);
      const g = städaGlosor(await fråga(hittaPåGlosorInstruktion(språk, ålder, ny.önskemål.trim(), ny.antal)));
      m = { ...bas, titel: g.titel || "Glosor", sidor: 0, språk: { från: "sv", till: språk.kod, namn: språk.namn }, glosor: numrera(g.glosor, "g", []) };
    } else if (typ === "glosor" && !förberett) {
      // Glosor läses direkt från bilderna, några sidor åt gången.
      visaArbete(["Läser sidorna", "Hittar glosorna", "Sparar"], 0);
      const { bilder, text, varningar: v } = await samlaIn(ny.filer, ny.klistrad);
      varningar = v;
      const perGång = bildgräns?.maxCount ?? 1;
      const delar = [];
      const grupper = bilder.length ? Array.from({ length: Math.ceil(bilder.length / perGång) }, (_, i) => bilder.slice(i * perGång, (i + 1) * perGång)) : [null];
      for (const [i, grupp] of grupper.entries()) {
        visaArbete(["Läser sidorna", "Hittar glosorna", "Sparar"], 1, grupper.length > 1 ? `Del ${i + 1} av ${grupper.length}` : "");
        const svar = await fråga(glosInstruktion(språk, ålder, !!grupp, i === 0 ? text : "", tvinga || i > 0), grupp ?? undefined);
        if (svar?.forslag && TYPER[svar.forslag] && svar.forslag !== typ) return vyFörslag(svar, null);
        delar.push(städaGlosor(svar));
      }
      const sett = new Set();
      const glosor = delar.flatMap((d) => d.glosor).filter((g) => {
        const k = (g.sv + "|" + g.ut).toLowerCase(); if (sett.has(k)) return false; sett.add(k); return true; });
      m = { ...bas, titel: delar[0].titel || "Glosor", sidor: bilder.length, språk: { från: "sv", till: språk.kod, namn: språk.namn }, glosor: numrera(glosor, "g", []) };
    } else {
      // Grammatik och faktatext: skriv av allt först, gör sedan frågor av hela texten.
      const steg = ["Läser sidorna", typ === "glosor" ? "Hittar glosorna" : `Gör ${vad(typ)}`, "Sparar"];
      let bok = förberett?.bok, sam = förberett?.sam;
      if (!bok) {
        visaArbete(steg, 0);
        bok = await läsInText(ny.filer, ny.klistrad, MAX_SIDOR, "s", 0, stegStatus(0));
        sam = ny.samFiler.length && typ !== "glosor"
          ? await läsInText(ny.samFiler, "", MAX_SIDOR_TOTALT - bok.sidor, "t", 0, (t) => visaArbete(steg, 0, "Lärarens sammanfattning: " + t))
          : { stycken: [], sidor: 0, varningar: [] };
        varningar = [...bok.varningar, ...sam.varningar];
        if (!bok.stycken.length && !sam.stycken.length) throw new Error("Det gick inte att läsa någon text ur sidorna.");
      }
      if (typ === "glosor") {
        // Glosor av en text som redan är avskriven (efter att typen bytts).
        visaArbete(steg, 1);
        const g = städaGlosor(await fråga(glosInstruktion(språk, ålder, false, läxText(bok.stycken, sam.stycken), true)));
        m = { ...bas, titel: g.titel || "Glosor", sidor: bok.sidor, språk: { från: "sv", till: språk.kod, namn: språk.namn }, glosor: numrera(g.glosor, "g", []) };
      } else {
        visaArbete(steg, 1, typ === "fakta" && ny.upptäckare ? "30 frågor och 10 Upptäckar-frågor" : `30 ${vad(typ)}`);
        const [svar, upptäckarSvar] = await Promise.all([
          fråga(huvudInstruktion(typ, ålder, språk, bok.stycken, sam.stycken, tvinga)),
          typ === "fakta" && ny.upptäckare ? fråga(upptäckarInstruktion(ålder, läxText(bok.stycken, sam.stycken), 10, [])) : null,
        ]);
        if (svar?.forslag && TYPER[svar.forslag] && svar.forslag !== typ) return vyFörslag(svar, { bok, sam });
        const ids = new Set([...bok.stycken, ...sam.stycken].map((s) => s.id));
        const fragor = städaFrågor(svar?.fragor, ids);
        if (!fragor.length) throw new Error(`Claude kunde inte göra några ${vad(typ)} av materialet.`);
        m = { ...bas, titel: str(svar.titel) || TYPER[typ].namn, sidor: bok.sidor + sam.sidor,
          text: bok.stycken, ...(sam.stycken.length && { provtext: sam.stycken }), fragor: numrera(fragor, "f", []) };
        if (typ === "grammatik") {
          m.språk = { från: "sv", till: språk.kod, namn: språk.namn };
          m.regler = (Array.isArray(svar.regler) ? svar.regler : []).map((r) => ({ rubrik: str(r.rubrik), text: str(r.text) })).filter((r) => r.text);
        } else {
          m.sammanfattning = str(svar.sammanfattning);
          m.begrepp = numrera((Array.isArray(svar.begrepp) ? svar.begrepp : []).map((b) => ({ ord: str(b.ord), forklaring: str(b.forklaring) })).filter((b) => b.ord && b.forklaring), "b", []);
          if (upptäckarSvar) {
            const u = städaUpptäckare(upptäckarSvar);
            if (u.fragor.length) m.upptackare = u;
          }
        }
      }
    }
    visaArbete(stegLista, stegLista.length - 1);
    const sparad = await sparaLäxa(m);
    vyKlar(m, { sekunder: Math.round((performance.now() - start) / 1000), sparad, varningar });
  } catch (e) {
    if (e?.code === "cancelled") vyMaterial();
    else vyFel(felText(e));
  } finally {
    pågående = null;
  }
}

// ---------- Skicka (läxkod i ett meddelande) ----------
function b64url(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function packa(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === "function") {
    const ström = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z" + b64url(new Uint8Array(await new Response(ström).arrayBuffer()));
  }
  return "j" + b64url(bytes);
}
// Läxan skickas som ett meddelande med en läxkod, inte som en länk. iMessage visar inte
// meddelanden med mycket långa länkar, och på iPhone öppnas länkar ändå i Safari i stället för i appen.
// En stor läxa delas upp i flera meddelanden. Appen samlar ihop delarna (Läxkod 1/2 grupp: …).
const DEL_GRÄNS = 12000;
const INSTRUKTION = "Håll fingret på meddelandet och välj Kopiera. Öppna Studiehjälpen och tryck på 📋 Klistra in.";
function smsDelar(m, kod) {
  if (kod.length <= DEL_GRÄNS) return [`📚 Ny läxa: ${m.titel}\n${INSTRUKTION}\n\nLäxkod: ${kod}`];
  const antal = Math.ceil(kod.length / DEL_GRÄNS);
  const grupp = Math.random().toString(36).slice(2, 6);
  return Array.from({ length: antal }, (_, i) =>
    `📚 Ny läxa: ${m.titel} (del ${i + 1} av ${antal})\n${INSTRUKTION} Gör så med alla ${antal} delarna.\n\nLäxkod ${i + 1}/${antal} ${grupp}: ${kod.slice(i * DEL_GRÄNS, (i + 1) * DEL_GRÄNS)}`);
}

// Safari kräver att kopieringen startar direkt i klicket. Med ClipboardItem kan texten
// packas klart efteråt; annars faller vi tillbaka på writeText och sist på att visa texten.
async function tillUrklipp(textLöfte, statusEl) {
  try {
    if (!window.ClipboardItem || !navigator.clipboard?.write) throw 0;
    await navigator.clipboard.write([new ClipboardItem({ "text/plain": Promise.resolve(textLöfte).then((t) => new Blob([t], { type: "text/plain" })) })]);
    return true;
  } catch {}
  const text = await textLöfte;
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    statusEl.hidden = false; statusEl.classList.remove("fel");
    statusEl.replaceChildren("Kunde inte kopiera automatiskt. Markera och kopiera:", h("p", { class: "kod" }, text));
    return false;
  }
}
function kopieraKnapp(hämtaMaterial, statusEl) {
  return async () => {
    const m = hämtaMaterial();
    const delarLöfte = packa(m).then((kod) => smsDelar(m, kod));
    if (!(await tillUrklipp(delarLöfte.then((d) => d[0]), statusEl))) return;
    const delar = await delarLöfte;
    statusEl.hidden = false; statusEl.classList.remove("fel");
    if (delar.length === 1) return void (statusEl.textContent = "✅ Kopierat! Klistra in i ett sms till barnet.");
    // Flera delar: del 1 är redan kopierad. Varje del skickas som ett eget sms.
    statusEl.replaceChildren(
      h("p", {}, `Läxan är stor och skickas i ${delar.length} sms. Del 1 är kopierad – skicka den. Kopiera sedan nästa del och skicka den också.`),
      h("div", { class: "rad" }, ...delar.map((text, i) => h("button", { onclick: async (e) => {
        const knapp = e.currentTarget;
        if (await tillUrklipp(text, statusEl)) knapp.textContent = `✅ Del ${i + 1} kopierad`;
      } }, i === 0 ? "✅ Del 1 kopierad" : `📋 Kopiera del ${i + 1}`))));
  };
}

// ---------- Mina läxor ----------
async function sparaLäxa(m) {
  if (!samling) return false;
  try {
    await samling.doc(m.id).set({ titel: m.titel, typ: m.typ, för: m.för ?? null, uppdaterad: new Date().toISOString(), material: m });
    return true;
  } catch { return false; }
}

let senasteLäxor = [];
let öppenLäxa = null;
let öppenDetalj = null; // { id, el } – återanvänds när listan ritas om, så att meddelanden står kvar
// Listor ritas om när läxor sparas (även från en annan telefon), men bara på sidor som visar dem.
let visasNu = "start";
function taEmotLäxor(snap) {
  senasteLäxor = snap.docs.filter((d) => d.data()?.material).map((d) => ({ id: d.id, ...d.data() }));
  const personDoc = snap.docs.find((d) => d.id === "_personer");
  if (personDoc && !pågående) personer = personDoc.data().personer ?? [];

// person = null visar äldre läxor som inte hör till någon person.

  const lista = läxorFör(person);
  visa(
    h("button", { class: "länk", onclick: tillbaka }, "← Tillbaka"),

      : h("p", { class: "kort" }, "Inga läxor än. Allt du skapar hamnar här."),

      if (öppen && öppenDetalj?.id !== l.id) öppenDetalj = { id: l.id, el: läxDetalj(l.id, structuredClone(m)) };
      return h("div", { class: "stapel" }, knapp, öppen ? öppenDetalj.el : null);
    }),
    person ? h("button", { class: "primär", onclick: () => { ny = { person, filer: [], samFiler: [], klistrad: "", upptäckare: true, källa: "foto", antal: 15 }; vyTyp(); } }, "✨ Ny läxa") : null,
  );
  visasNu = "läxor";
}

function läxDetalj(id, m) {
  const status = h("div", { class: "status", hidden: true });
  const meddela = (text, fel = false) => { status.hidden = false; status.textContent = text; status.classList.toggle("fel", fel); };
  const kanUtöka = m.typ !== "glosor" && Array.isArray(m.text);
  const knappar = [];
  const kör = async (gör) => {
    if (!sample) return meddela("Claude är inte tillgängligt här.", true);
    knappar.forEach((b) => (b.disabled = true));
    pågående = new AbortController();
    try { const resultat = await gör(); await sparaLäxa(m); meddela(`✅ ${resultat ?? "Klart!"} Tryck på 📋 Kopiera för sms och skicka till barnet. Framstegen finns kvar i appen.`); }
    catch (e) { meddela(e?.code === "cancelled" ? "Avbrutet." : felText(e), e?.code !== "cancelled"); }
    finally { knappar.forEach((b) => (b.disabled = false)); pågående = null; }
  };
  const knapp = (text, gör) => { const k = h("button", { onclick: () => kör(gör) }, text); knappar.push(k); return k; };
  const filVal = (text, gör) => {
    const input = h("input", { type: "file", multiple: true, accept: "image/*,.pdf,application/pdf,.docx",
      onchange: () => { if (input.files.length) { const f = [...input.files]; input.value = ""; kör(() => gör(f)); } } });
    return h("label", { class: "knapp" }, text, input);
  };
  const sidorKvar = () => MAX_SIDOR_TOTALT - (m.sidor ?? 0);
  const allaIds = () => new Set([...m.text, ...(m.provtext ?? [])].map((s) => s.id));
  const befintliga = () => m.fragor.map((f) => [f.fraga || f.pastaende, f.mening].filter(Boolean).join(" "));
  const nästaNr = (lista) => Math.max(0, ...(lista ?? []).map((s) => parseInt(s.id.slice(1), 10) || 0));
  const antalProv = m.fragor?.filter((f) => f.prov).length ?? 0;
  let raderaSteg = false;
  const radera = h("button", { class: "farlig", onclick: async () => {
    if (!raderaSteg) { raderaSteg = true; radera.textContent = "Tryck igen för att ta bort"; return; }
    try { await samling.doc(id).delete(); öppenLäxa = null; öppenDetalj = null; } catch (e) { meddela(felText(e), true); }
  } }, "🗑️ Ta bort ur listan");

  // Glosor: fler från foto, påhittade av Claude eller inskrivna för hand. Nya glosor får nya id,
  // så att barnets framsteg på de gamla finns kvar när läxan skickas igen.
  const glosor = m.typ === "glosor";
  const glosSpråk = () => ({ kod: m.språk?.till ?? "en", namn: m.språk?.namn ?? "engelska" });
  const läggTillGlosor = (nya) => {
    const sett = new Set(m.glosor.map((g) => `${g.sv}|${g.ut}`.toLowerCase()));
    const unika = nya.filter((g) => { const k = `${g.sv}|${g.ut}`.toLowerCase(); if (sett.has(k)) return false; sett.add(k); return true; });
    if (!unika.length) throw new Error("Inga nya glosor – de fanns redan i läxan.");
    m.glosor.push(...numrera(unika, "g", m.glosor));
    return unika.length === 1 ? "1 ny glosa tillagd." : `${unika.length} nya glosor tillagda.`;
  };
  const önskemål = h("input", { type: "text", placeholder: "t.ex. fler djur – eller lämna tomt för samma ämne" });
  const antal = h("select", {}, ...[5, 10, 15, 20].map((n) => h("option", { value: n }, `${n} glosor`)));
  antal.value = "10";
  const egna = h("textarea", { rows: 4, placeholder: "hund – dog\nkatt – cat" });

  return h("div", { class: "detalj" },
    h("button", { class: "primär stor", onclick: kopieraKnapp(() => m, status) }, "📋 Kopiera för sms"),
    glosor ? h("p", { class: "liten" }, `${m.glosor.length} glosor · ${glosSpråk().namn}`) : null,
    glosor ? filVal("📷 Fler glosor från foto eller fil", async (filer) => {
      meddela("Claude läser…");
      const { bilder, text } = await samlaIn(filer, "", MAX_SIDOR);
      const perGång = bildgräns?.maxCount ?? 1;
      const grupper = bilder.length ? Array.from({ length: Math.ceil(bilder.length / perGång) }, (_, i) => bilder.slice(i * perGång, (i + 1) * perGång)) : [null];
      const nya = [];
      for (const [i, grupp] of grupper.entries()) {
        const svar = await fråga(glosInstruktion(glosSpråk(), m.ålder || 12, !!grupp, i === 0 ? text : "", true), grupp ?? undefined);
        nya.push(...städaGlosor(svar).glosor);
      }
      return läggTillGlosor(nya);
    }) : null,
    glosor ? h("details", {},
      h("summary", {}, "✨ Låt Claude hitta på fler"),
      h("div", { class: "stapel", style: "margin-top:8px" },
        h("label", {}, "Vad ska de handla om?", önskemål),
        h("label", {}, "Hur många?", antal),
        knapp("✨ Hitta på glosor", async () => {
          meddela("Claude hittar på glosor…");
          const ämne = önskemål.value.trim() || `Fler glosor i samma stil och på samma ämne som de som redan finns (läxan heter "${m.titel}").`;
          const svar = await fråga(hittaPåGlosorInstruktion(glosSpråk(), m.ålder || 12, ämne, Number(antal.value), m.glosor));
          return läggTillGlosor(städaGlosor(svar).glosor);
        }))) : null,
    glosor ? h("details", {},
      h("summary", {}, "✏️ Skriv in glosor själv"),
      h("div", { class: "stapel", style: "margin-top:8px" },
        h("p", { class: "liten" }, "En glosa per rad, med streck, kolon eller likhetstecken emellan."),
        egna,
        h("button", { onclick: async () => {
          const nya = egna.value.split("\n").map((rad) => rad.split(/\s*(?:\t|–|—|=|:|;|\s-\s)\s*/))
            .filter((d) => d.length >= 2 && d[0].trim() && d[1].trim()).map((d) => ({ sv: d[0].trim(), ut: d.slice(1).join(" ").trim() }));
          if (!nya.length) return meddela("Skriv minst en glosa, till exempel hund – dog.", true);
          try { const text = läggTillGlosor(nya); await sparaLäxa(m); egna.value = ""; meddela(`✅ ${text} Tryck på 📋 Kopiera för sms och skicka till barnet.`); }
          catch (e) { meddela(felText(e), true); }
        } }, "Lägg till"))) : null,
    kanUtöka ? h("p", { class: "liten" }, `${m.sidor ?? "?"} av ${MAX_SIDOR_TOTALT} sidor · ${m.fragor.length} ${vad(m.typ)}${antalProv ? `, varav ${antalProv} provfrågor` : ""}${m.provtext ? " · har lärarens sammanfattning" : ""}`) : null,
    kanUtöka ? filVal(m.provtext ? "📝 Lägg till mer av lärarens sammanfattning" : "📝 Lägg till lärarens sammanfattning", async (filer) => {
      if (sidorKvar() <= 0) throw new Error(`Läxan har redan ${MAX_SIDOR_TOTALT} sidor, som är max.`);
      meddela("Claude läser sammanfattningen…");
      const sam = await läsInText(filer, "", Math.min(MAX_SIDOR, sidorKvar()), "t", nästaNr(m.provtext), (t) => meddela("Claude läser sammanfattningen: " + t));
      if (!sam.stycken.length) throw new Error("Det gick inte att läsa någon text ur sammanfattningen.");
      meddela("Claude gör provfrågor… Det tar ungefär en minut.");
      const svar = await fråga(provInstruktion(m, sam.stycken));
      const nya = städaFrågor(svar?.fragor, new Set([...allaIds(), ...sam.stycken.map((s) => s.id)])).map((f) => ({ ...f, prov: true }));
      if (!nya.length) throw new Error("Claude kunde inte göra några provfrågor.");
      const matchar = new Set(Array.isArray(svar.matchar) ? svar.matchar : []);
      for (const f of m.fragor) if (matchar.has(f.id)) f.prov = true;
      m.provtext = [...(m.provtext ?? []), ...sam.stycken];
      m.sidor = (m.sidor ?? 0) + sam.sidor;
      m.fragor.push(...numrera(nya, "f", m.fragor));
    }) : null,
    kanUtöka ? filVal("📖 Lägg till fler sidor", async (filer) => {
      if (sidorKvar() <= 0) throw new Error(`Läxan har redan ${MAX_SIDOR_TOTALT} sidor, som är max.`);
      meddela("Claude läser sidorna…");
      const bok = await läsInText(filer, "", Math.min(MAX_SIDOR, sidorKvar()), "s", nästaNr(m.text), (t) => meddela("Claude läser: " + t));
      if (!bok.stycken.length) throw new Error("Det gick inte att läsa någon text ur sidorna.");
      meddela(`Claude gör ${vad(m.typ)} om de nya sidorna…`);
      const svar = await fråga(nyaSidorInstruktion(m, bok.stycken, befintliga()));
      const nya = städaFrågor(svar?.fragor, new Set([...allaIds(), ...bok.stycken.map((s) => s.id)]));
      m.text = [...m.text, ...bok.stycken];
      m.sidor = (m.sidor ?? 0) + bok.sidor;
      m.fragor.push(...numrera(nya, "f", m.fragor));
    }) : null,
    kanUtöka ? knapp(`➕ Gör 15 fler ${vad(m.typ)}`, async () => {
      meddela(`Claude gör 15 nya ${vad(m.typ)}… Det tar ungefär en halv minut.`);
      const nya = städaFrågor((await fråga(flerInstruktion(m, befintliga())))?.fragor, allaIds());
      if (!nya.length) throw new Error(`Claude kunde inte göra några nya ${vad(m.typ)}.`);
      m.fragor.push(...numrera(nya, "f", m.fragor));
    }) : null,
    kanUtöka && m.typ === "fakta" ? knapp(m.upptackare ? "🌟 Gör 10 fler Upptäckar-frågor" : "🌟 Lägg till Upptäckar-frågor", async () => {
      meddela("Claude gör 10 Upptäckar-frågor… Det tar ungefär en halv minut.");
      const svar = await fråga(upptäckarInstruktion(m.ålder || 12, läxText(m.text, m.provtext), 10, (m.upptackare?.fakta ?? []).map((v) => v.text)));
      m.upptackare = städaUpptäckare(svar, m.upptackare);
    }) : null,
    m.typ === "fakta" && !kanUtöka ? h("p", { class: "liten" }, "Den här läxan skapades innan texten sparades. Skapa den igen för att kunna lägga till mer.") : null,
    !personNamn(m.för) && personer.length ? h("label", {}, "Flytta till",
      h("select", { onchange: async (e) => { if (!e.target.value) return; m.för = e.target.value; await sparaLäxa(m); öppenLäxa = null; öppenDetalj = null; } },
        h("option", { value: "" }, "Välj person…"), ...personer.map((p) => h("option", { value: p.id }, `${p.emoji} ${p.namn}`)))) : null,
    status,
    radera);
}

// ---------- Start ----------
(async () => {
  const delar = [];
  delar.push(typeof pdfjsLib !== "undefined" ? "PDF-läsare: ok" : "PDF-läsare: laddades inte");
  delar.push(typeof mammoth !== "undefined" ? "Word-läsare: ok" : "Word-läsare: laddades inte");
  try { personer = JSON.parse(localStorage.getItem("skaparen.personer") || "[]"); } catch {}
  börjaOm();
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (sample) {
    try { bildgräns = (await sample.limits()).images ?? null; } catch { bildgräns = null; }
    delar.unshift(bildgräns ? `Claude: ok, upp till ${bildgräns.maxCount} bilder per gång` : "Claude: ok, men bilder går inte i den här vyn");
  } else {
    delar.unshift("Claude: inte tillgängligt här");
  }
  // Läxor och personer sparas privat på ditt Claude-konto, så de finns både på mobilen och datorn.
  try {
    const [db, user] = window.claude ? await Promise.all([window.claude.use("db"), window.claude.use("user")]) : [null, null];
    const uid = await user?.id();
    if (db && uid) {
      samling = db.collection(`data/users/${uid}`);
      samling.orderBy("uppdaterad", "desc").onSnapshot(taEmotLäxor, () => {});
      // Personerna hämtas en gång direkt, så att listan syns även innan första läxan finns.
      const p = await samling.doc("_personer").get();
      if (p.exists) { personer = p.data().personer ?? []; if (visasNu === "start") vyStart(); }
      delar.push("Mina läxor: ok");
    } else {
      delar.push("Mina läxor: inte tillgängligt");
    }
  } catch {}
  $("diag").textContent = delar.join(" · ");
})();
</script>
